specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: BondingCurveFactory
    network: monad-testnet
    source:
      address: "0x54eE35d85740CbB12B5cAB18A179ff6F5C7b28FF"
      abi: BondingCurveFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - Factory
      abis:
        - name: BondingCurveFactory
          file: ./abis/BondingCurveFactory.json
        - name: BondingCurve
          file: ./abis/BondingCurve.json
      eventHandlers:
        - event: Create(indexed address,indexed address,indexed address,string,string,string,uint256,uint256)
          handler: handleCreate
      file: ./src/factory.ts
templates:
  - kind: ethereum/contract
    name: BondingCurve
    network: monad-testnet
    source:
      abi: BondingCurve
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - Trade
        - Candle1m
        - Factory
      abis:
        - name: BondingCurve
          file: ./abis/BondingCurve.json
        - name: UniswapV2Pair
          file: ./abis/UniswapV2Pair.json
      eventHandlers:
        - event: Buy(indexed address,indexed address,uint256,uint256)
          handler: handleBuy
        - event: Sell(indexed address,indexed address,uint256,uint256)
          handler: handleSell
        - event: Listing(address,address,address,uint256,uint256,uint256)
          handler: handleListing
      file: ./src/curve.ts
  - kind: ethereum/contract
    name: UniswapV2Pair
    network: monad-testnet
    source:
      abi: UniswapV2Pair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - Trade
        - Candle1m
      abis:
        - name: UniswapV2Pair
          file: ./abis/UniswapV2Pair.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
      file: ./src/pair.ts
